apiVersion: v1
kind: Service
metadata:
  name: aos-postgres
spec:
  clusterIP: None
  selector:
    app: aos-postgres
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aos-postgres
spec:
  serviceName: aos-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aos-postgres
  template:
    metadata:
      labels:
        app: aos-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: aos
            - name: POSTGRES_USER
              value: aos
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aos-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
          volumeMounts:
            # MOUNTED AT /var/lib/postgresql, NOT /var/lib/postgresql/data.
            #
            # postgres:18-alpine ships PGDATA=/var/lib/postgresql/18/docker and declares
            # VOLUME /var/lib/postgresql. The path /var/lib/postgresql/data — which every
            # pre-18 example uses — does not exist in this image. Mounting there yields a
            # container that starts, serves, and loses the entire database on every
            # restart, with no error at any point.
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aos", "-d", "aos"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aos", "-d", "aos"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
