apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aos-backups
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aos-backup
spec:
  # Nightly. A single-node instance with one volume has no other copy of anything.
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
          containers:
            - name: dump
              image: postgres:18-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aos-secrets
                      key: postgres-password
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  DEST=/backups/aos-$STAMP.dump
                  echo "dumping to $DEST"
                  pg_dump -h aos-postgres -U aos -d aos -Fc -f "$DEST"

                  # Verify BEFORE rotating. Deleting the last good copy to make room for a
                  # broken one is the failure this ordering exists to prevent, and it is only
                  # ever discovered on the day it matters.
                  echo "verifying $DEST"
                  pg_restore --list "$DEST" > /dev/null
                  BYTES=$(wc -c < "$DEST")
                  if [ "$BYTES" -lt 4096 ]; then
                    echo "refusing to rotate: $DEST is only $BYTES bytes" >&2
                    exit 1
                  fi
                  echo "verified $DEST ($BYTES bytes)"

                  # Keep the newest N verified dumps and nothing else.
                  KEEP=${AOS_BACKUP_KEEP:-14}
                  ls -1t /backups/aos-*.dump | tail -n +$((KEEP + 1)) | while read -r OLD; do
                    echo "rotating out $OLD"
                    rm -f "$OLD"
                  done
                  ls -1t /backups/aos-*.dump | head -5
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: aos-backups
